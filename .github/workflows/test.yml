name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        # timeout は package.json の test script に一元化 (CI の Chromium cold-launch flake 対策)
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify dist/cli.js exists
        run: test -f dist/cli.js && head -1 dist/cli.js

      - name: Verify npm package
        run: bun run pack:smoke
